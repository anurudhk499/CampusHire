{% extends 'base.html' %}
{% from '_macros.html' import csrf %}
{% block title %}Student login{% endblock %}
{% block content %}
<div class="auth-wrap glass glass-body">
  <h3 class="mb-1">Student login</h3>
  <p class="text-muted">Use your USN and password.</p>
  <form method="post" novalidate>
    {{ csrf() }}
    <div class="mb-3"><label class="form-label" for="usn">USN</label>
      <input class="form-control text-uppercase" id="usn" name="usn" required autofocus autocomplete="username" placeholder="e.g. CH22AI001"></div>
    <div class="mb-4"><label class="form-label" for="password">Password</label>
      <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password"></div>
    <button class="btn btn-primary w-100">Log in</button>
  </form>
  <p class="text-center text-muted mt-3 mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
