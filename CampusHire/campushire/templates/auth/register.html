{% extends 'base.html' %}
{% from '_macros.html' import csrf %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-wrap glass glass-body">
  <h3 class="mb-1">Create your account</h3>
  <p class="text-muted">Your USN is your login. Passwords are stored as salted hashes.</p>
  <form method="post" novalidate>
    {{ csrf() }}
    <div class="mb-3"><label class="form-label" for="name">Full name</label>
      <input class="form-control" id="name" name="name" value="{{ form.get('name', '') }}" required autofocus></div>
    <div class="row g-3 mb-3">
      <div class="col-sm-7"><label class="form-label" for="usn">USN</label>
        <input class="form-control text-uppercase" id="usn" name="usn" value="{{ form.get('usn', '') }}" required maxlength="15"></div>
      <div class="col-sm-5"><label class="form-label" for="branch">Branch</label>
        <select class="form-select" id="branch" name="branch" required>
          <option value="">Select</option>
          {% for b in BRANCHES %}<option {{ 'selected' if form.get('branch') == b }}>{{ b }}</option>{% endfor %}
        </select></div>
    </div>
    <div class="mb-3"><label class="form-label" for="password">Password</label>
      <input class="form-control" type="password" id="password" name="password" minlength="8" required autocomplete="new-password">
      <div class="form-text">At least 8 characters.</div></div>
    <div class="mb-4"><label class="form-label" for="confirm">Confirm password</label>
      <input class="form-control" type="password" id="confirm" name="confirm" required autocomplete="new-password"></div>
    <button class="btn btn-primary w-100">Create account</button>
  </form>
  <p class="text-center text-muted mt-3 mb-0">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
